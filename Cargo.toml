# mini-rs/Cargo.toml
[workspace]
resolver = "3"
members = [
    "ministore",
    "minisnap",
    "ministate",
    # "miniqueue",
]

[workspace.package]
publish = false
authors = ["ArcellaTeam"]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ArcellaTeam/mini-rs/"

[workspace.dependencies]
futures = "0.3.33"
rmp-serde = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27"
tokio = { version = "1.53", default-features = false }
thiserror = "2.0.18"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
